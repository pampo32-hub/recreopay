<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo asfalto noche limpio con degradado suave -->
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Estela de velocidad roja y dorada -->
    <linearGradient id="speedTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Supercarro deportivo rojo fuego -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fondo Pista Nocturna -->
  <rect width="1200" height="756" rx="36" fill="url(#trackBg)" />

  <!-- Líneas de velocidad aerodinámicas en el asfalto (Horizontales limpias) -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="100" y1="200" x2="600" y2="200" stroke-dasharray="80 30" />
    <line x1="200" y1="360" x2="750" y2="360" stroke-dasharray="120 40" stroke-width="3" />
    <line x1="50" y1="520" x2="650" y2="520" stroke-dasharray="100 50" />
  </g>

  <!-- Piano de Curva de Pista (Kerb / Red & White Curbs en el borde inferior) -->
  <g transform="translate(600, 680)">
    <polygon points="0,76 40,0 80,0 40,76" fill="#ef4444" />
    <polygon points="80,0 120,0 80,76 40,76" fill="#ffffff" />
    <polygon points="120,0 160,0 120,76 80,76" fill="#ef4444" />
    <polygon points="160,0 200,0 160,76 120,76" fill="#ffffff" />
    <polygon points="200,0 240,0 200,76 160,76" fill="#ef4444" />
    <polygon points="240,0 280,0 240,76 200,76" fill="#ffffff" />
    <polygon points="280,0 320,0 280,76 240,76" fill="#ef4444" />
    <polygon points="320,0 360,0 320,76 280,76" fill="#ffffff" />
    <polygon points="360,0 400,0 360,76 320,76" fill="#ef4444" />
    <polygon points="400,0 440,0 400,76 360,76" fill="#ffffff" />
    <polygon points="440,0 480,0 440,76 400,76" fill="#ef4444" />
    <polygon points="480,0 520,0 480,76 440,76" fill="#ffffff" />
    <polygon points="520,0 560,0 520,76 480,76" fill="#ef4444" />
    <polygon points="560,0 600,0 560,76 520,76" fill="#ffffff" />
  </g>

  <!-- Ilustración Super Auto de Carreras en la Derecha (Dejando 65% izquierdo limpio) -->
  <g transform="translate(740, 260)" filter="url(#carGlow)">
    
    <!-- Estelas de Luz y Velocidad que vienen desde atrás -->
    <path d="M -160 120 L 100 120" stroke="url(#speedTrail)" stroke-width="6" stroke-linecap="round" />
    <path d="M -120 160 L 60 160" stroke="url(#speedTrail)" stroke-width="4" stroke-linecap="round" />
    <path d="M -200 90 L 140 90" stroke="url(#speedTrail)" stroke-width="8" stroke-linecap="round" />
    <path d="M -80 200 L 120 200" stroke="url(#speedTrail)" stroke-width="5" stroke-linecap="round" />

    <!-- Silueta Lateral Dinámica de Supercarro Aerodinámico -->
    <g transform="translate(60, 40) scale(1.05)">
      <!-- Sombra inferior -->
      <ellipse cx="180" cy="180" rx="170" ry="16" fill="#000000" opacity="0.6" />

      <!-- Chasis / Carrocería deportiva -->
      <path d="M 20 140 C 40 100, 100 85, 160 85 C 230 85, 290 100, 340 135 C 360 145, 360 160, 340 165 C 310 168, 80 168, 30 165 C 15 160, 10 150, 20 140 Z" fill="url(#carBody)" />
      
      <!-- Techo y Parabrisas Aerodinámico en Cristal Oscuro -->
      <path d="M 90 95 C 130 50, 200 45, 250 85 L 280 100 C 240 90, 140 90, 90 95 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <path d="M 120 85 C 145 60, 190 55, 230 80 L 140 85 Z" fill="#ffffff" opacity="0.35" />

      <!-- Alerón Trasero Deportivo GT -->
      <path d="M 25 90 L 45 60 L 15 60 L 5 90 Z" fill="#1e293b" />
      <rect x="0" y="55" width="55" height="8" rx="3" fill="#ef4444" />

      <!-- Faros Delanteros LED Afilados -->
      <polygon points="325,138 350,146 328,150" fill="#fef08a" />
      <line x1="340" y1="145" x2="420" y2="145" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.6" />

      <!-- Toma de Aire Lateral -->
      <path d="M 150 120 L 190 120 L 175 145 L 140 145 Z" fill="#18181b" />

      <!-- Rueda Trasera Deportiva -->
      <circle cx="85" cy="160" r="34" fill="#09090b" stroke="#71717a" stroke-width="3" />
      <circle cx="85" cy="160" r="22" fill="#27272a" />
      <!-- Rin de aleación estrella -->
      <circle cx="85" cy="160" r="8" fill="#f59e0b" />
      <line x1="85" y1="138" x2="85" y2="182" stroke="#d4d4d8" stroke-width="3" />
      <line x1="63" y1="160" x2="107" y2="160" stroke="#d4d4d8" stroke-width="3" />

      <!-- Rueda Delantera Deportiva -->
      <circle cx="280" cy="160" r="34" fill="#09090b" stroke="#71717a" stroke-width="3" />
      <circle cx="280" cy="160" r="22" fill="#27272a" />
      <circle cx="280" cy="160" r="8" fill="#f59e0b" />
      <line x1="280" y1="138" x2="280" y2="182" stroke="#d4d4d8" stroke-width="3" />
      <line x1="258" y1="160" x2="302" y2="160" stroke="#d4d4d8" stroke-width="3" />
    </g>

    <!-- Bandera de Cuadros de Meta en la Esquina Superior -->
    <g transform="translate(240, 20) scale(0.7)">
      <rect x="0" y="0" width="16" height="16" fill="#ffffff" />
      <rect x="16" y="0" width="16" height="16" fill="#000000" />
      <rect x="32" y="0" width="16" height="16" fill="#ffffff" />
      <rect x="0" y="16" width="16" height="16" fill="#000000" />
      <rect x="16" y="16" width="16" height="16" fill="#ffffff" />
      <rect x="32" y="16" width="16" height="16" fill="#000000" />
      <rect x="0" y="32" width="16" height="16" fill="#ffffff" />
      <rect x="16" y="32" width="16" height="16" fill="#000000" />
      <rect x="32" y="32" width="16" height="16" fill="#ffffff" />
      <!-- Mástil -->
      <line x1="0" y1="0" x2="0" y2="70" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    </g>

  </g>

  <!-- Marco interior sutil rojo de competición -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4" />
</svg>
