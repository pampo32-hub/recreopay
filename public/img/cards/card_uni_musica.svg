<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo negro carbón mate limpio -->
    <linearGradient id="djBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Ecualizador degradado suave verde cian a magenta -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Audífonos con brillo metálico cian -->
    <linearGradient id="phonesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="musicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fondo Carbón Mate -->
  <rect width="1200" height="756" rx="36" fill="url(#djBg)" />

  <!-- Barras de Ecualizador de Audio a lo largo de la parte superior (Limpias y Geométricas) -->
  <g transform="translate(60, 60)" fill="url(#eqGrad)" opacity="0.85">
    <rect x="0" y="80" width="12" height="40" rx="4" />
    <rect x="20" y="50" width="12" height="70" rx="4" />
    <rect x="40" y="20" width="12" height="100" rx="4" />
    <rect x="60" y="60" width="12" height="60" rx="4" />
    <rect x="80" y="30" width="12" height="90" rx="4" />
    <rect x="100" y="70" width="12" height="50" rx="4" />
    <rect x="120" y="10" width="12" height="110" rx="4" />
    <rect x="140" y="40" width="12" height="80" rx="4" />
    <rect x="160" y="75" width="12" height="45" rx="4" />
    <rect x="180" y="25" width="12" height="95" rx="4" />
    <rect x="200" y="55" width="12" height="65" rx="4" />
    <rect x="220" y="15" width="12" height="105" rx="4" />
    <rect x="240" y="45" width="12" height="75" rx="4" />
    <rect x="260" y="85" width="12" height="35" rx="4" />
    <rect x="280" y="35" width="12" height="85" rx="4" />
    <rect x="300" y="65" width="12" height="55" rx="4" />
    <rect x="320" y="20" width="12" height="100" rx="4" />
    <rect x="340" y="50" width="12" height="70" rx="4" />
    <rect x="360" y="80" width="12" height="40" rx="4" />
    <rect x="380" y="30" width="12" height="90" rx="4" />
    <rect x="400" y="60" width="12" height="60" rx="4" />
    <rect x="420" y="90" width="12" height="30" rx="4" />
  </g>

  <!-- Ondas de Sonido Concéntricas y Plato DJ en la Esquina Inferior Derecha -->
  <g transform="translate(860, 240)" filter="url(#musicGlow)">
    
    <!-- Anillos concéntricos de vinilo / tornamesa DJ -->
    <g fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3">
      <circle cx="160" cy="240" r="180" stroke-dasharray="20 10" />
      <circle cx="160" cy="240" r="140" />
      <circle cx="160" cy="240" r="100" stroke-dasharray="12 6" />
      <circle cx="160" cy="240" r="60" />
    </g>

    <!-- Audífonos DJ Profesionales Iluminados -->
    <g transform="translate(20, 20)">
      <!-- Diadema superior curvada -->
      <path d="M 40 200 C 40 40, 240 40, 240 200" fill="none" stroke="url(#phonesGrad)" stroke-width="22" stroke-linecap="round" />
      <path d="M 60 190 C 60 65, 220 65, 220 190" fill="none" stroke="#090d16" stroke-width="8" stroke-linecap="round" />

      <!-- Almohadilla Izquierda -->
      <rect x="18" y="170" width="46" height="85" rx="23" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
      <circle cx="41" cy="212" r="12" fill="#06b6d4" />

      <!-- Almohadilla Derecha -->
      <rect x="216" y="170" width="46" height="85" rx="23" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
      <circle cx="239" cy="212" r="12" fill="#06b6d4" />
    </g>

    <!-- Faders de Mezcladora DJ Sutiles -->
    <g transform="translate(90, 310)" fill="#475569">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#334155" stroke-width="4" stroke-linecap="round" />
      <rect x="-10" y="25" width="20" height="12" rx="3" fill="#06b6d4" />

      <line x1="40" y1="0" x2="40" y2="70" stroke="#334155" stroke-width="4" stroke-linecap="round" />
      <rect x="30" y="10" width="20" height="12" rx="3" fill="#ec4899" />

      <line x1="80" y1="0" x2="80" y2="70" stroke="#334155" stroke-width="4" stroke-linecap="round" />
      <rect x="70" y="45" width="20" height="12" rx="3" fill="#10b981" />
    </g>

    <!-- Chispas musicales / notas -->
    <g fill="#ec4899" opacity="0.6">
      <!-- Nota corchea 1 -->
      <path d="M 50 80 L 50 115 A 8 8 0 1 1 42 123 L 42 80 L 70 72 L 70 107 A 8 8 0 1 1 62 115 L 62 72 Z" />
    </g>
  </g>

  <!-- Marco interior sutil cian neón tenue -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" />
</svg>
