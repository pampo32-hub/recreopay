<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo suave lila a menta pastel -->
    <linearGradient id="gamerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <filter id="gamerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#a855f7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="756" rx="36" fill="url(#gamerBg)" />

  <!-- Líneas sutiles geométricas en cuadrícula gamer muy tenue -->
  <g stroke="#c084fc" stroke-width="1" opacity="0.12" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Corazoncitos y chispas pixel pastel flotando suavemente -->
  <g fill="#ec4899" opacity="0.6">
    <!-- Corazón 1 -->
    <path d="M 850 140 A 10 10 0 0 0 835 150 A 10 10 0 0 0 850 165 L 850 165 L 865 150 A 10 10 0 0 0 850 140 Z" />
    <!-- Corazón 2 -->
    <path d="M 1080 340 A 8 8 0 0 0 1068 348 A 8 8 0 0 0 1080 360 L 1080 360 L 1092 348 A 8 8 0 0 0 1080 340 Z" />
    <!-- Corazón 3 -->
    <path d="M 720 180 A 6 6 0 0 0 711 186 A 6 6 0 0 0 720 195 L 720 195 L 729 186 A 6 6 0 0 0 720 180 Z" />
  </g>

  <!-- Pixel stars / destellos -->
  <g fill="#a855f7" opacity="0.5">
    <rect x="760" y="240" width="8" height="8" rx="2" />
    <rect x="1100" y="180" width="10" height="10" rx="2" />
    <rect x="920" y="100" width="6" height="6" rx="2" />
    <rect x="680" y="280" width="6" height="6" rx="2" />
  </g>

  <!-- Ilustración Gamer Pastel en la derecha (Dejando 65% izquierdo limpio) -->
  <g transform="translate(820, 200)" filter="url(#gamerShadow)">
    
    <!-- Diadema con Orejitas de Gato (Cat-Ear Headset) -->
    <!-- Arco de la diadema -->
    <path d="M 60 220 C 60 70, 240 70, 240 220" fill="none" stroke="url(#headsetGrad)" stroke-width="20" stroke-linecap="round" />
    
    <!-- Orejita Izquierda de Gato -->
    <polygon points="90,135 125,50 150,110" fill="url(#headsetGrad)" />
    <polygon points="100,125 125,70 140,110" fill="#fbcfe8" />

    <!-- Orejita Derecha de Gato -->
    <polygon points="150,110 175,50 210,135" fill="url(#headsetGrad)" />
    <polygon points="160,110 175,70 200,125" fill="#fbcfe8" />

    <!-- Almohadilla Auricular Izquierdo -->
    <rect x="40" y="200" width="36" height="70" rx="18" fill="#ffffff" stroke="#f472b6" stroke-width="4" />
    <circle cx="58" cy="235" r="8" fill="#f472b6" opacity="0.5" />

    <!-- Almohadilla Auricular Derecho -->
    <rect x="224" y="200" width="36" height="70" rx="18" fill="#ffffff" stroke="#f472b6" stroke-width="4" />
    <circle cx="242" cy="235" r="8" fill="#f472b6" opacity="0.5" />

    <!-- Micrófono Curvo con Corazón -->
    <path d="M 58 255 C 58 310, 110 320, 130 320" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" />
    <circle cx="135" cy="320" r="10" fill="#a855f7" />
    <circle cx="135" cy="320" r="5" fill="#ffffff" />

    <!-- Mando de Consola Gamer Pastel Flotante -->
    <g transform="translate(45, 290)">
      <!-- Cuerpo del Mando -->
      <path d="M 30 70 C 10 120, 0 170, 50 170 C 80 170, 95 130, 110 130 C 125 130, 140 170, 170 170 C 220 170, 210 120, 190 70 C 175 35, 145 35, 110 35 C 75 35, 45 35, 30 70 Z" fill="url(#controllerGrad)" stroke="#c084fc" stroke-width="4" />

      <!-- Cruceta Direccional D-Pad Rosa -->
      <path d="M 60 70 H 70 V 60 H 80 V 70 H 90 V 80 H 80 V 90 H 70 V 80 H 60 Z" fill="#f472b6" />

      <!-- Botones de Acción ABXY Pastel -->
      <circle cx="150" cy="65" r="6" fill="#38bdf8" />
      <circle cx="165" cy="75" r="6" fill="#f472b6" />
      <circle cx="135" cy="75" r="6" fill="#34d399" />
      <circle cx="150" cy="88" r="6" fill="#fbbf24" />

      <!-- Joysticks L y R -->
      <circle cx="85" cy="115" r="14" fill="#e9d5ff" stroke="#c084fc" stroke-width="2" />
      <circle cx="135" cy="115" r="14" fill="#e9d5ff" stroke="#c084fc" stroke-width="2" />

      <!-- Botón Home con Corazón -->
      <circle cx="110" cy="75" r="7" fill="#f472b6" />
    </g>

  </g>

  <!-- Marco interior sutil blanco/lila -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
</svg>
