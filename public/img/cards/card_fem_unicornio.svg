<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo acuarela pastel suave lila a rosa -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8fc" />
      <stop offset="50%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>

    <!-- Nubes suaves de fondo -->
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Degradado crin arcoiris pastel -->
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Cuerno dorado -->
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Filtro de sombra suave -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="756" rx="36" fill="url(#bgGrad)" />

  <!-- Destellos y nubes de ensueño -->
  <circle cx="950" cy="450" r="300" fill="url(#cloudGlow)" />
  <circle cx="200" cy="180" r="220" fill="url(#cloudGlow)" />

  <!-- Estrellas doradas y lila sutiles -->
  <g fill="#eab308" opacity="0.6">
    <!-- Estrella 1 -->
    <path d="M 850 180 Q 850 200 870 200 Q 850 200 850 220 Q 850 200 830 200 Q 850 200 850 180 Z" />
    <!-- Estrella 2 -->
    <path d="M 1080 260 Q 1080 275 1095 275 Q 1080 275 1080 290 Q 1080 275 1065 275 Q 1080 275 1080 260 Z" />
    <!-- Estrella 3 -->
    <path d="M 720 120 Q 720 130 730 130 Q 720 130 720 140 Q 720 130 710 130 Q 720 130 720 120 Z" />
    <!-- Pequeñas chispas -->
    <circle cx="890" cy="140" r="3" />
    <circle cx="780" cy="240" r="2.5" />
    <circle cx="1120" cy="400" r="3" />
    <circle cx="680" cy="200" r="2" />
  </g>

  <!-- Arco de destello suave en esquina superior izquierda -->
  <path d="M 0 0 Q 300 80 500 0 Z" fill="#ffffff" opacity="0.3" />

  <!-- Personaje: Unicornio Tierno de Ensueño (Ubicado a la derecha, dejando el 65% izquierdo limpio) -->
  <g transform="translate(820, 220)" filter="url(#softShadow)">
    <!-- Crin Ondulada Trasera -->
    <path d="M 60 120 C 130 140, 200 230, 180 340 C 160 300, 120 280, 80 260 Z" fill="url(#maneGrad)" opacity="0.8" />
    <path d="M 80 180 C 160 210, 220 310, 200 420 C 170 370, 120 340, 90 320 Z" fill="url(#maneGrad)" opacity="0.6" />

    <!-- Cabeza y Cuello del Unicornio -->
    <path d="M 20 450 C 40 380, 50 300, 40 220 C 35 180, 60 140, 90 130 C 120 120, 140 140, 150 170 C 165 220, 190 280, 180 350 C 170 420, 150 480, 120 520 Z" fill="#ffffff" />
    
    <!-- Orejita Tierna -->
    <path d="M 60 140 C 65 100, 85 90, 95 110 C 100 125, 95 145, 80 155 Z" fill="#ffffff" />
    <path d="M 68 135 C 72 110, 82 105, 88 118 C 91 127, 88 138, 78 143 Z" fill="#fbcfe8" />

    <!-- Cuerno Mágico Dorado con Espirales -->
    <path d="M 95 125 L 140 20 L 115 115 Z" fill="url(#goldHorn)" />
    <!-- Líneas del cuerno -->
    <path d="M 103 95 Q 115 88 123 93" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 112 65 Q 123 60 130 64" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 122 40 Q 130 36 135 39" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Ojo Tierno Cerrado con Pestañas Soñadoras -->
    <path d="M 110 200 Q 125 212 140 200" stroke="#4a044e" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 135 204 L 142 200" stroke="#4a044e" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 206 L 128 212" stroke="#4a044e" stroke-width="3" stroke-linecap="round" />
    <path d="M 115 204 L 110 208" stroke="#4a044e" stroke-width="3" stroke-linecap="round" />

    <!-- Mejilla Sonrojada (Blush) -->
    <ellipse cx="132" cy="225" rx="14" ry="9" fill="#f472b6" opacity="0.4" />

    <!-- Mechón Frontal de la Crin -->
    <path d="M 70 145 C 90 130, 120 135, 125 155 C 110 165, 90 170, 75 165 Z" fill="#f472b6" />
    <path d="M 60 165 C 80 155, 110 160, 115 180 C 100 190, 80 195, 65 185 Z" fill="#c084fc" />
    <path d="M 50 185 C 70 175, 95 180, 100 200 C 85 210, 70 212, 55 205 Z" fill="#60a5fa" />
    <path d="M 45 205 C 65 195, 85 200, 90 220 C 75 228, 60 230, 48 222 Z" fill="#34d399" />
  </g>

  <!-- Marco interior sutil blanco/lila -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
</svg>
