<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo océano turquesa suave a aguamarina -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>

    <!-- Ondas de luz marina -->
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Cola de sirena nacarada -->
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="mermaidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Fondo Turquesa Cristalino -->
  <rect width="1200" height="756" rx="36" fill="url(#oceanBg)" />

  <!-- Rayos de luz submarina suaves -->
  <path d="M 150 0 L 250 756 L 380 756 L 220 0 Z" fill="url(#waveGlow)" opacity="0.6" />
  <path d="M 400 0 L 520 756 L 620 756 L 460 0 Z" fill="url(#waveGlow)" opacity="0.4" />
  <path d="M 700 0 L 800 756 L 880 756 L 750 0 Z" fill="url(#waveGlow)" opacity="0.5" />

  <!-- Burbujas marinas transparentes con brillo blanco -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="820" cy="480" r="16" />
    <circle cx="823" cy="475" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="760" cy="380" r="10" />
    <circle cx="762" cy="377" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="920" cy="220" r="12" />
    <circle cx="1060" cy="180" r="18" />
    <circle cx="1064" cy="174" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="680" cy="560" r="8" />
  </g>

  <!-- Cola de Sirena Elegante (En la esquina inferior derecha) -->
  <g transform="translate(860, 260)" filter="url(#mermaidGlow)">
    <!-- Aletas de la Cola (Flukes) -->
    <!-- Aleta Izquierda -->
    <path d="M 140 180 C 180 80, 80 10, 0 30 C 50 80, 100 130, 130 180 Z" fill="url(#finGrad)" opacity="0.9" />
    <path d="M 130 180 C 100 100, 40 50, 0 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    
    <!-- Aleta Derecha -->
    <path d="M 150 185 C 220 90, 260 20, 280 60 C 240 120, 190 160, 150 185 Z" fill="url(#finGrad)" opacity="0.85" />
    <path d="M 150 185 C 200 120, 240 80, 280 60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Cuerpo Curvo de la Sirena -->
    <path d="M 130 180 C 145 220, 160 290, 130 360 C 100 430, 60 470, 20 500 C 60 500, 140 460, 180 390 C 210 330, 190 240, 150 185 Z" fill="url(#tailGrad)" />

    <!-- Escamas Delicadas Brillantes -->
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5">
      <path d="M 130 240 Q 145 255 160 240" />
      <path d="M 145 260 Q 160 275 175 260" />
      <path d="M 125 280 Q 140 295 155 280" />
      <path d="M 110 320 Q 125 335 140 320" />
      <path d="M 125 340 Q 140 355 155 340" />
      <path d="M 90 380 Q 105 395 120 380" />
      <path d="M 70 420 Q 85 435 100 420" />
    </g>

    <!-- Estrella de Mar Pastel en la base -->
    <g transform="translate(180, 390) scale(0.8)">
      <polygon points="25,0 32,17 50,17 36,28 41,45 25,35 9,45 14,28 0,17 18,17" fill="#f43f5e" opacity="0.8" />
      <circle cx="25" cy="23" r="3" fill="#ffffff" opacity="0.7" />
    </g>
  </g>

  <!-- Destellos y Estrellitas Brillantes -->
  <g fill="#0284c7" opacity="0.4">
    <path d="M 780 180 Q 780 190 790 190 Q 780 190 780 200 Q 780 190 770 190 Q 780 190 780 180 Z" />
    <path d="M 980 120 Q 980 130 990 130 Q 980 130 980 140 Q 980 130 970 130 Q 980 130 980 120 Z" />
    <path d="M 1100 320 Q 1100 328 1108 328 Q 1100 328 1100 336 Q 1100 328 1092 328 Q 1100 328 1100 320 Z" />
  </g>

  <!-- Marco interior sutil blanco/nácar -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
</svg>
