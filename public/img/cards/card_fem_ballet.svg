<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo suave rosa palo a perla -->
    <linearGradient id="balletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="45%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Raso / Satén de zapatillas de ballet -->
    <linearGradient id="satinPointe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="balletShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="756" rx="36" fill="url(#balletBg)" />

  <!-- Destello de tul de tutú suave -->
  <ellipse cx="980" cy="500" rx="250" ry="180" fill="#ffffff" opacity="0.6" />
  <ellipse cx="250" cy="200" rx="180" ry="120" fill="#ffffff" opacity="0.4" />

  <!-- Chispas doradas elegantes -->
  <g fill="#d97706" opacity="0.5">
    <path d="M 850 160 Q 850 175 865 175 Q 850 175 850 190 Q 850 175 835 175 Q 850 175 850 160 Z" />
    <path d="M 1060 220 Q 1060 230 1070 230 Q 1060 230 1060 240 Q 1060 230 1050 230 Q 1060 230 1060 220 Z" />
    <circle cx="920" cy="110" r="3" />
    <circle cx="780" cy="280" r="2.5" />
    <circle cx="1120" cy="380" r="3" />
  </g>

  <!-- Ilustración de Zapatillas de Ballet con Cintas Fluidas en la Derecha -->
  <g transform="translate(860, 180)" filter="url(#balletShadow)">
    
    <!-- Cintas de Satén Fluidas (Lazos cruzados elegantes) -->
    <path d="M 120 60 C 180 80, 240 140, 200 240 C 160 340, 80 280, 130 380" fill="none" stroke="url(#ribbonGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M 100 100 C 60 140, 40 220, 80 290 C 120 360, 180 340, 160 440" fill="none" stroke="url(#ribbonGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7" />

    <!-- Zapatilla Izquierda en Punta -->
    <g transform="translate(40, 160) rotate(-15)">
      <!-- Suela y empeine -->
      <path d="M 40 40 C 60 30, 90 40, 100 80 C 110 130, 100 220, 95 280 C 92 310, 68 315, 55 315 C 42 315, 30 305, 30 270 C 30 210, 20 120, 25 70 C 28 50, 32 42, 40 40 Z" fill="url(#satinPointe)" />
      <!-- Punta cuadrada de ballet -->
      <rect x="42" y="305" width="32" height="12" rx="4" fill="#fda4af" />
      <!-- Brillo de satén -->
      <path d="M 45 80 C 45 130, 50 220, 55 270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none" />
      <!-- Lazos en el empeine -->
      <line x1="32" y1="90" x2="95" y2="140" stroke="url(#ribbonGrad)" stroke-width="5" />
      <line x1="95" y1="90" x2="32" y2="140" stroke="url(#ribbonGrad)" stroke-width="5" />
    </g>

    <!-- Zapatilla Derecha en Punta -->
    <g transform="translate(130, 140) rotate(12)">
      <!-- Suela y empeine -->
      <path d="M 40 40 C 60 30, 90 40, 100 80 C 110 130, 100 220, 95 280 C 92 310, 68 315, 55 315 C 42 315, 30 305, 30 270 C 30 210, 20 120, 25 70 C 28 50, 32 42, 40 40 Z" fill="url(#satinPointe)" />
      <rect x="42" y="305" width="32" height="12" rx="4" fill="#fda4af" />
      <path d="M 45 80 C 45 130, 50 220, 55 270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none" />
      <line x1="32" y1="90" x2="95" y2="140" stroke="url(#ribbonGrad)" stroke-width="5" />
      <line x1="95" y1="90" x2="32" y2="140" stroke="url(#ribbonGrad)" stroke-width="5" />
    </g>

    <!-- Pequeña Tiara de Princesa / Bailarina en la parte superior -->
    <g transform="translate(80, 20) scale(0.9)">
      <path d="M 10 40 L 30 10 L 50 30 L 70 5 L 90 30 L 110 10 L 130 40 Z" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round" />
      <circle cx="70" cy="5" r="4" fill="#fbbf24" />
      <circle cx="30" cy="10" r="3" fill="#fbbf24" />
      <circle cx="110" cy="10" r="3" fill="#fbbf24" />
    </g>

  </g>

  <!-- Marco interior sutil perla -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
</svg>
