<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo metal titanio cepillado oscuro -->
    <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d" />
      <stop offset="30%" stop-color="#2a303f" />
      <stop offset="70%" stop-color="#181c25" />
      <stop offset="100%" stop-color="#242936" />
    </linearGradient>

    <!-- Reflejo diagonal de luz metálica cepillada -->
    <linearGradient id="metalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Gradiente plateado para acentos y líneas -->
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="metalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo Metal Oscuro Base -->
  <rect width="1200" height="756" rx="36" fill="url(#metalBg)" />

  <!-- Patrón de textura cepillada (Líneas ultra finas horizontales de micro-cepillado) -->
  <g stroke="#ffffff" stroke-width="0.7" opacity="0.04">
    <line x1="0" y1="20" x2="1200" y2="20" />
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="290" x2="1200" y2="290" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="0" y1="370" x2="1200" y2="370" />
    <line x1="0" y1="410" x2="1200" y2="410" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="490" x2="1200" y2="490" />
    <line x1="0" y1="530" x2="1200" y2="530" />
    <line x1="0" y1="570" x2="1200" y2="570" />
    <line x1="0" y1="610" x2="1200" y2="610" />
    <line x1="0" y1="650" x2="1200" y2="650" />
    <line x1="0" y1="690" x2="1200" y2="690" />
    <line x1="0" y1="730" x2="1200" y2="730" />
  </g>

  <!-- Reflejo diagonal de luz metálica pulida -->
  <polygon points="0,0 450,0 200,756 0,756" fill="url(#metalSheen)" />
  <polygon points="550,0 950,0 700,756 300,756" fill="url(#metalSheen)" />

  <!-- Acento Geométrico y Emblema de Líneas Limpias en la Derecha (Estilo Technological Metal de la referencia) -->
  <g transform="translate(860, 220)" filter="url(#metalShadow)">
    
    <!-- Círculo de corte orbital grabado -->
    <circle cx="160" cy="160" r="140" fill="none" stroke="url(#silverAccent)" stroke-width="2" opacity="0.3" stroke-dasharray="16 8" />
    <circle cx="160" cy="160" r="100" fill="none" stroke="url(#silverAccent)" stroke-width="1.5" opacity="0.4" />

    <!-- Emblema Geométrico Elegante Grabado en Metal (Silueta Robot Minimalista Lineal) -->
    <g transform="translate(100, 100)" stroke="url(#silverAccent)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Cabeza cuadrada con esquinas redondeadas -->
      <rect x="20" y="30" width="80" height="70" rx="18" opacity="0.85" />
      
      <!-- Antena central con microesfera -->
      <line x1="60" y1="10" x2="60" y2="30" opacity="0.85" />
      <circle cx="60" cy="8" r="4" fill="url(#silverAccent)" />

      <!-- Ojos grabados sutiles -->
      <circle cx="45" cy="62" r="8" opacity="0.9" />
      <circle cx="75" cy="62" r="8" opacity="0.9" />

      <!-- Sonrisa sutil -->
      <path d="M 46 82 Q 60 92 74 82" opacity="0.85" />

      <!-- Orejas / Conectores laterales -->
      <rect x="8" y="55" width="12" height="20" rx="4" opacity="0.7" />
      <rect x="100" y="55" width="12" height="20" rx="4" opacity="0.7" />
    </g>

    <!-- Indicador de Edición Especial grabado -->
    <text x="160" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="4" opacity="0.7">TITANIUM EDITION</text>
  </g>

  <!-- Marco interior grabado con bisel metálico plateado -->
  <rect x="24" y="24" width="1152" height="708" rx="24" fill="none" stroke="url(#silverAccent)" stroke-width="1.5" opacity="0.3" />
  <rect x="28" y="28" width="1144" height="700" rx="22" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />
</svg>
