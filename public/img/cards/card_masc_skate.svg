<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756">
  <defs>
    <!-- Fondo textura de madera de arce natural de patineta -->
    <linearGradient id="woodGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9" />
      <stop offset="25%" stop-color="#e8ba87" />
      <stop offset="50%" stop-color="#deb078" />
      <stop offset="75%" stop-color="#f0c697" />
      <stop offset="100%" stop-color="#dfa86c" />
    </linearGradient>

    <!-- Franjas de veta de madera -->
    <linearGradient id="woodStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99153" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#c99153" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c99153" stop-opacity="0.3" />
    </linearGradient>

    <!-- Graffiti degradado cian a magenta -->
    <linearGradient id="graffitiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="skateShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo Madera Natural Pulida -->
  <rect width="1200" height="756" rx="36" fill="url(#woodGrain)" />

  <!-- Vetad de madera sutiles horizontales -->
  <g fill="none" stroke="#b4783c" stroke-width="1.5" opacity="0.25">
    <path d="M 0 80 Q 400 95 800 75 T 1200 90" />
    <path d="M 0 180 Q 500 160 900 190 T 1200 170" />
    <path d="M 0 290 Q 300 310 700 280 T 1200 300" />
    <path d="M 0 420 Q 600 400 1000 430 T 1200 410" />
    <path d="M 0 550 Q 400 570 800 540 T 1200 560" />
    <path d="M 0 670 Q 500 650 900 680 T 1200 660" />
  </g>

  <!-- Ruedas y ejes stencil tenues en la esquina superior izquierda -->
  <g fill="#292524" opacity="0.15">
    <circle cx="90" cy="80" r="30" />
    <circle cx="90" cy="80" r="14" fill="url(#woodGrain)" />
    <circle cx="170" cy="80" r="30" />
    <circle cx="170" cy="80" r="14" fill="url(#woodGrain)" />
    <rect x="70" y="74" width="120" height="12" rx="6" />
  </g>

  <!-- Ilustración Skate Park en la Derecha (Dejando 65% izquierdo limpio) -->
  <g transform="translate(800, 180)" filter="url(#skateShadow)">
    
    <!-- Manchas de pintura urbana / salpicaduras de spray -->
    <g fill="#06b6d4" opacity="0.25">
      <circle cx="240" cy="80" r="45" />
      <circle cx="310" cy="60" r="12" />
      <circle cx="190" cy="110" r="18" />
    </g>
    <g fill="#ec4899" opacity="0.2">
      <circle cx="160" cy="380" r="55" />
      <circle cx="100" cy="410" r="15" />
      <circle cx="210" cy="440" r="22" />
    </g>

    <!-- Tabla de Skateboard en Diagonal con Ruedas y Grip Tape -->
    <g transform="translate(180, 260) rotate(-42)">
      <!-- Deck / Tabla -->
      <rect x="-40" y="-180" width="80" height="360" rx="38" fill="#1c1917" stroke="#fbbf24" stroke-width="4" />
      
      <!-- Líneas de grip tape de diseño -->
      <line x1="-36" y1="-50" x2="36" y2="-50" stroke="#f59e0b" stroke-width="3" />
      <line x1="-36" y1="50" x2="36" y2="50" stroke="#f59e0b" stroke-width="3" />

      <!-- Trucks y Ruedas -->
      <rect x="-56" y="-120" width="112" height="16" rx="8" fill="#78716c" />
      <circle cx="-56" cy="-112" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <circle cx="56" cy="-112" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

      <rect x="-56" y="104" width="112" height="16" rx="8" fill="#78716c" />
      <circle cx="-56" cy="112" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <circle cx="56" cy="112" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Silueta Negra de Skater en el Aire Haciendo un Truco (Ollie / Kickflip) -->
    <g transform="translate(80, 40) scale(1.1)" fill="#1c1917">
      <!-- Cabeza con gorra hacia atrás -->
      <circle cx="85" cy="55" r="18" />
      <path d="M 68 45 Q 60 40 50 42 Q 62 50 72 52 Z" />
      <!-- Torso dinámico inclinado -->
      <path d="M 80 72 L 60 140 L 95 140 L 105 78 Z" />
      <!-- Brazo izquierdo extendido para equilibrio -->
      <path d="M 78 80 L 35 60 L 20 70 L 40 92 L 72 95 Z" />
      <!-- Brazo derecho al aire -->
      <path d="M 102 82 L 140 70 L 152 82 L 115 100 Z" />
      <!-- Pierna delantera flexionada -->
      <path d="M 65 138 L 40 190 L 60 215 L 75 195 L 75 145 Z" />
      <!-- Pierna trasera en extensión empujando la tabla -->
      <path d="M 90 140 L 125 180 L 155 210 L 145 225 L 110 190 L 85 148 Z" />
    </g>

    <!-- Graffiti Callejero Estilizado "SKATE" -->
    <g transform="translate(30, 360)">
      <!-- Sombra graffiti -->
      <text x="2" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#0c4a6e" font-style="italic" letter-spacing="3">SKATE</text>
      <!-- Texto principal cian/fucsia -->
      <text x="0" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#graffitiGrad)" stroke="#ffffff" stroke-width="3" font-style="italic" letter-spacing="3">SKATE</text>
    </g>

  </g>

  <!-- Marco interior sutil estilo madera rústica -->
  <rect x="20" y="20" width="1160" height="716" rx="26" fill="none" stroke="#78350f" stroke-width="2" opacity="0.3" />
</svg>
